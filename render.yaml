# Render Blueprint — see https://render.com/docs/blueprint-spec
#
# Deploys the Next.js web app only. The dealer crawler (`npm run crawl`) is
# deliberately NOT included here — Render's cron job service type has no
# free tier (billed per-second, ~$1/month minimum) and requires payment
# details on file for the whole Blueprint even though this web service is
# free. Decided to run the crawl manually (or from your own scheduler) for
# now instead — see PLAN.md §7's open hosting item if that changes later.
#
# Needs DATABASE_URL (the Neon connection string) — set as a secret in the
# Render dashboard after importing this Blueprint, not committed here. Use
# the pooled connection string; drizzle.config.ts falls back to
# DATABASE_URL when DATABASE_URL_UNPOOLED isn't set, so one var covers both
# the app and migrations.
#
# To deploy: push this file to the repo, then in the Render dashboard choose
# "New > Blueprint" and point it at this repo.

services:
  - type: web
    name: carvalue
    runtime: node
    plan: free
    region: singapore # closest Render region to NZ — reduces latency to dealer sites and to users
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
    # Free-tier web services spin down after ~15 min idle and cold-start on
    # the next request (10-50s). Fine for a friends-and-family-scale project;
    # upgrade to a paid instance type ($7/mo+) if that latency becomes annoying.
